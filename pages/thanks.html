<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedankt | Walk Brussels</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="icon" href="../images/icons/Fav.png" type="image/png">
    <script src="../js/mode-toggle.js" defer></script>
    <script src="../js/language-toggle.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="nav__logo" href="../index.html">
                <img class="nav__logo-image" src="../images/icons/walkyellow.png" alt="Walk Brussels">
            </a>

            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" id="nav-about" href="https://www.walk.brussels/nl/qui-sommes-nous">Over ons</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link nav__link--button" id="nav-report" href="obstacle.html">Meld een obstakel</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="thanks-page">
        <img
            class="thanks-page__line"
            src="../images/icons/fl%C3%A8che3_jaune.avif"
            alt=""
            aria-hidden="true"
        >

        <section class="thanks-card" aria-labelledby="thanks-title">
            <div class="step-indicator" aria-label="Voortgang">
                <span class="step-indicator__item is-complete">1</span>
                <span class="step-indicator__line is-complete"></span>
                <span class="step-indicator__item is-complete">2</span>
                <span class="step-indicator__line is-complete"></span>
                <span class="step-indicator__item is-complete">3</span>
                <span class="step-indicator__line is-complete"></span>
                <span class="step-indicator__item step-indicator__item--check is-active" aria-label="Klaar"></span>
            </div>

            <img class="thanks-card__check thanks-card__check--color" src="../images/icons/check-yellow.png" alt="" aria-hidden="true">
            <img class="thanks-card__check thanks-card__check--bw" src="../images/icons/check-black.png" alt="" aria-hidden="true">
            <h1 class="thanks-card__title" id="thanks-title">Bedankt!</h1>
            <p class="thanks-card__text" id="thanks-text">Jouw melding helpt<br>Brussel vooruit.</p>

            <a class="thanks-card__button" id="home-button" href="../index.html">Terug naar de<br>homepagina</a>
        </section>
    </main>
</body>
</html>
