<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commentaar | Walk Brussels</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="icon" href="../images/icons/Fav.png" type="/images/icons/Fav">
    <script src="../js/mode-toggle.js" defer></script>
    <script src="../js/user-data.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="nav__logo" href="../index.html">
                <img class="nav__logo-image" src="../images/icons/walkyellow.png" alt="Walk Brussels">
            </a>

            <ul class="nav__list">
                <li class="nav__item">
                    <a class="nav__link" href="https://www.walk.brussels/nl/qui-sommes-nous">Over ons</a>
                </li>
                <li class="nav__item">
                    <a class="nav__link nav__link--button" href="obstacle.html">Meld een obstakel</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="report report--details">
        <a class="report__arrow report__arrow--previous" href="photo.html" aria-label="Vorige stap">
            <img src="../images/icons/arrow_next-button.svg" alt="" aria-hidden="true">
        </a>

        <form class="details-form" id="userForm" action="thanks.html">
            <div class="step-indicator" aria-label="Voortgang">
                <span class="step-indicator__item is-complete">1</span>
                <span class="step-indicator__line is-complete"></span>
                <span class="step-indicator__item is-complete">2</span>
                <span class="step-indicator__line is-complete"></span>
                <span class="step-indicator__item is-active">3</span>
                <span class="step-indicator__line"></span>
                <span class="step-indicator__item step-indicator__item--check" aria-label="Klaar"></span>
            </div>

            <section class="details-step" aria-labelledby="comment-title">
                <div class="details-step__heading">
                    <p class="details-step__number">3. Commentaar <span class="color-only">(optioneel)</span></p>
                    <h1 class="details-step__title" id="comment-title">Indien nodig, geef extra informatie<br>over het probleem.</h1>
                </div>

                <label class="sr-only" for="comment">Beschrijf kort het probleem</label>
                <textarea class="details-form__comment" id="comment" name="comment" placeholder="Beschrijf kort het probleem..."></textarea>
            </section>

            <section class="details-step details-step--contact" aria-labelledby="contact-title">
                <div class="details-step__heading">
                    <p class="details-step__number">4. Jouw gegevens <span class="color-only">(optioneel)</span></p>
                    <h2 class="details-step__title" id="contact-title">Laat je gegevens achter voor<br>opvolging.</h2>
                </div>

                <label class="sr-only" for="firstName">Voornaam</label>
                <input class="details-form__name" id="firstName" name="firstName" type="text" placeholder="Voornaam">

                <label class="sr-only" for="lastName">Naam</label>
                <input class="details-form__name" id="lastName" name="lastName" type="text" placeholder="Naam">

                <label class="sr-only" for="email">E-mailadres</label>
                <input class="details-form__email" id="email" name="email" type="email" placeholder="E-mail adres">

                <label class="sr-only" for="gemeente">Gemeente</label>
                <select class="details-form__select" id="gemeente" name="gemeente">
                    <option value="">Kies je gemeente</option>
                    <option value="1000">1000 Brussel</option>
                    <option value="1030">1030 Schaarbeek</option>
                    <option value="1040">1040 Etterbeek</option>
                    <option value="1050">1050 Elsene</option>
                    <option value="1060">1060 Sint-Gillis</option>
                    <option value="1070">1070 Anderlecht</option>
                    <option value="1080">1080 Molenbeek</option>
                    <option value="1081">1081 Koekelberg</option>
                    <option value="1082">1082 Sint-Agatha-Berchem</option>
                    <option value="1083">1083 Ganshoren</option>
                    <option value="1090">1090 Jette</option>
                    <option value="1140">1140 Evere</option>
                    <option value="1150">1150 Sint-Pieters-Woluwe</option>
                    <option value="1160">1160 Oudergem</option>
                    <option value="1170">1170 Watermaal-Bosvoorde</option>
                    <option value="1180">1180 Ukkel</option>
                    <option value="1190">1190 Vorst</option>
                    <option value="1200">1200 Sint-Lambrechts-Woluwe</option>
                    <option value="1210">1210 Sint-Joost-ten-Node</option>
                    <option value="walk">Walk Brussels</option>
                    <option value="vrijetrottoirslibres">Vrije trottoirs libres</option>
                    <option value="autreobstacle">Andere obstakels</option>
                </select>

                <label class="details-form__newsletter" for="newsletter">
                    <input class="details-form__newsletter-input" id="newsletter" name="newsletter" type="checkbox">
                    <span>Ik ga akkoord om de nieuwsbrief van Walk.Brussels te ontvangen.</span>
                </label>

                <p class="details-form__result" id="formResult" aria-live="polite"></p>
            </section>

            <button class="details-form__button" type="submit">Verstuur melding</button>
        </form>
    </main>
</body>
</html>
