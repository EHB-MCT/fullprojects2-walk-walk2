<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk Brussels</title>
    <link rel="stylesheet" href="css/main.css">

<body>

        <nav class="nav" aria-label="Main navigation">

            <ul class="nav__list">
